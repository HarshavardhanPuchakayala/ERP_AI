[project]
name = "erp-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "harshavardhan.puchakayala9@gmail.com", email = "harshavardhan.puchakayala9@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "langchain-core>=1.7.3",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "mcp[cli]<2",
    "openai>=3.42.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
erp-copilot = "erp_copilot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]


[tool.pytest.ini_options]
pythonpath = ["src/erp_copilot"]
testpaths = ["tests"]
addopts = "-m 'not llm'"
markers = ["llm: calls a real free model over the network (slow, may be flaky)"]